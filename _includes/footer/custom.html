<!-- Night mode: toggle + auto-switch after sundown (IIT Palakkad) -->
<style>
  /* ---- Night mode color overrides ---- */
  html[data-nightmode="on"] body,
  html[data-nightmode="on"] .page,
  html[data-nightmode="on"] .archive,
  html[data-nightmode="on"] .sidebar,
  html[data-nightmode="on"] .masthead,
  html[data-nightmode="on"] .page__content,
  html[data-nightmode="on"] .page__footer,
  html[data-nightmode="on"] .archive__item,
  html[data-nightmode="on"] .toc,
  html[data-nightmode="on"] table,
  html[data-nightmode="on"] .initial-content,
  html[data-nightmode="on"] .dept-header,
  html[data-nightmode="on"] .dept-nav,
  html[data-nightmode="on"] .dept-footer,
  html[data-nightmode="on"] .page-sidebar,
  html[data-nightmode="on"] #main {
    background-color: #121212 !important;
    color: #f1f1f1 !important;
    border-color: #333 !important;
  }
 
  html[data-nightmode="on"] a {
    color: #6fc3df !important;
  }
 
  /* ---- Floating toggle button ---- */
  #nightmode-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #333;
    color: #fff;
    font-size: 20px;
    line-height: 46px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
 
  #nightmode-toggle:hover {
    opacity: 0.85;
  }
 
  @media (max-width: 600px) {
    #nightmode-toggle {
      bottom: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      font-size: 17px;
      line-height: 40px;
    }
  }
</style>
 
<button id="nightmode-toggle" title="Toggle night mode">🌙</button>
<script src="/assets/js/nightmode.js"></script>
