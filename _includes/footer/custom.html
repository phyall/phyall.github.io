<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
 
<!-- Night mode: toggle + auto-switch after sundown (IIT Palakkad) -->
<style>
  /* Invert the whole page's colors when night mode is on.
     This covers every block on the site automatically, regardless
     of class names, instead of listing selectors one by one. */
  html[data-nightmode="on"] {
    filter: invert(1) hue-rotate(180deg);
    background: #fff;
  }
 
  /* Un-invert images, videos, and the toggle button itself so they
     don't look like photo negatives / stay visually consistent. */
  html[data-nightmode="on"] img,
  html[data-nightmode="on"] svg,
  html[data-nightmode="on"] video,
  html[data-nightmode="on"] iframe,
  html[data-nightmode="on"] #nightmode-toggle {
    filter: invert(1) hue-rotate(180deg);
  }
 
  /* Exception: the department logo has a solid white background
     baked into the image file (no transparency), so instead of
     un-inverting it (which would keep that white box visible),
     let it invert along with the rest of the page. */
  html[data-nightmode="on"] .dept-logo {
    filter: none;
  }
 
  /* ---- Floating toggle button ---- */
  #nightmode-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #333;
    color: #fff;
    font-size: 20px;
    line-height: 46px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
 
  #nightmode-toggle:hover {
    opacity: 0.85;
  }
 
  @media (max-width: 600px) {
    #nightmode-toggle {
      bottom: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      font-size: 17px;
      line-height: 40px;
    }
  }
</style>
 
<button id="nightmode-toggle" title="Toggle night mode">🌙</button>
<script src="/assets/js/nightmode.js"></script>
