<table class="student-table">

  <thead>
    <tr>
      <th style="width:25%">Roll</th>
      <th>Name</th>
    </tr>
  </thead>

  <tbody>

  {% assign students = include.students | sort: "roll" %}

  {% for student in students %}

    {% if student.degree == true %}

    <tr>
      <td>{{ student.roll }}</td>
      <td>{{ student.name }}</td>
    </tr>

    {% endif %}

  {% endfor %}

  </tbody>

</table>
