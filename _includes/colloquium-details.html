{% assign datestamp = page.name | remove: ".md" | plus: 0 %}

{% assign colloquium = site.data.colloquium
  | where: "datestamp", datestamp
  | first
%}

<div class="colloquium-details">

  <p><strong>Speaker:</strong> {{ colloquium.speaker }}</p>

  <p><strong>Time:</strong> {{ colloquium.time }}</p>

  <p><strong>Venue:</strong> {{ colloquium.venue }}</p>

  <p><strong>Title:</strong> {{ colloquium.title }}</p>

</div>
