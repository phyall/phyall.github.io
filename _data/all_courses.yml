- code: 5006
  title: Statistical Mechanics
  program: msc
  category: core
  ltpc: "3-0-0-3"
  credit: 3
  type: theory
  year: 1
  semester: 2
  offered_by: dop
  link:
  status: approved
  course_type: PMC
  prerequisites:
  basket:
  senate:
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Foundations of statistical mechanics"
      lectures: 7
      tutorials: 2
      labs: 0

      topics:
        - "Relation of thermodynamics and statistical mechanics"
        - "Gibbs' paradox"
        - "Phase space, Liouville's theorem"

    - module: 2
      title: "Ensemble theory"
      lectures: 13
      tutorials: 4
      labs: 0

      topics:
        - "Microcanonical, canonical and grand canonical ensembles and partition function"
        - "Calculation of physical properties (e.g. heat capacity, entropy)"
        - "Review and derivation of thermodynamic relations from ensemble theory"
        - "Variance and stability"

    - module: 3
      title: "Quantum statistics"
      lectures: 15
      tutorials: 4
      labs: 0

      topics:
        - "Maxwell-Boltzmann statistics for ideal gases"
        - "Quantum statistical mechanics: Fermi-Dirac statistics, Bose-Einstein statistics"
        - "Thermodynamics of ideal Fermi gas"
