        - "Series and parallel arrangements of resistances and cells"
        - "Kirchhoff's laws and simple applications"
        - "Heating effect of current"

    - module: 3
      title: "Magnetostatics"
      lectures: 5
      tutorials: 3
      labs: 0

      topics:
        - "Biot-Savart's law and Ampere's law"
