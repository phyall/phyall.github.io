# Applicable Mathematics
- code: 5005
  title: Applicable Mathematics
  program: msc
  category: core
  ltpc: "3-0-2-4"
  credit: 4
  type: theory
  year: 1
  semester: 1
  offered_by: dop
  link:
  status: approved
  course_type: PMC
  prerequisites:
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Complex variables"
      lectures: 9
      tutorials: 1
      labs: 0

      topics:
        - "Analytic functions of a complex variable, differentiation and the Cauchy-Riemann conditions"
        - "Contour integrals and Cauchy's theorem"
        - "Taylor and Laurent series"
        - "Singularities: poles, essential singularities, residue theorem"
        - "Analytic continuation, multiple-valued functions, branch points and branch cut integration"
        - "Method of steepest descent"

    - module: 2
      title: "Probability theory and random variables"
      lectures: 7
      tutorials: 1
      labs: 0

      topics:
        - "Probability distributions and probability densities from a statistical mechanics viewpoint, Dirac delta distributions"
        - "Statistical inference: Bayesian statistics"
        - "Standard discrete and continuous probability distributions"
        - "Moments and generating functions"
        - "Central limit theorem (statement and applications)"

    - module: 3
      title: "Numerical methods"
      lectures: 29
      tutorials: 0
      labs: 10

      topics:
        - "Basics of computer programming"
        - "Modelling data: interpolation and fitting, Lagrange and Newton interpolation methods, divided difference table"
        - "Piecewise polynomial interpolation, error in polynomial interpolation"
        - "Least squares regression: linear, multiple linear and nonlinear regression"
        - "Linear algebra: solving coupled linear equations, eigenvalues and eigenvectors, elimination method and pivoting, LU decomposition"
        - "Solutions of nonlinear equations and minimization of functions"
        - "Numerical differentiation and integration: divided difference method for differentiation, Newton-Cotes formula, midpoint, trapezoidal, rectangular and Simpson's rules, quadrature methods"
        - "Solutions of ordinary differential equations: Euler and predictor-corrector methods, Runge-Kutta method, adaptive step size selection"
        - "Solutions of partial differential equations"

  # ===============
  # Study Materials
  # ===============
  study_materials:

    textbooks:

      - title: "Mathematical Methods for Physicists"
        authors: "G. Arfken and H. J. Weber"
