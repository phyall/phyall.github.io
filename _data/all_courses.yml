#  General Relativity
- code: 6002
  title: General Relativity
  program: msc
  category: elective
  ltpc: "3-0-0-3"
  credit: 3
  type: theory
  year: 2
  semester:
  offered_by: dop
  link:
  status: approved
  course_type: PME
  prerequisites: 5001, 5003
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Special relativity"
      lectures: 7
      tutorials: 0
      labs: 0

      topics:
        - "Principle of relativity and electrodynamics, postulates of special relativity"
        - "Invariance of interval, Lorentz transformations, simultaneity in special relativity"
        - "Four-vectors and tensors"
        - "Action for the relativistic free particle, conservation of four-momentum"
        - "Action for charged particles, Maxwell's equations in covariant form"

    - module: 2
      title: "Towards general relativity"
      lectures: 5
      tutorials: 0
      labs: 0

      topics:
        - "Action at a distance, gravity as geometry"
        - "The equivalence principle"
        - "Dealing with geometry: curvilinear coordinates"
        - "Covariant and contravariant tensors"

    - module: 3
      title: "Formalization: manifolds and differential geometry"
      lectures: 8
      tutorials: 0
      labs: 0

      topics:
        - "Manifolds, calculus on manifolds: functions, curves, vectors and one-forms, tensors"
        - "Differential geometry: metric, covariant derivative, affine connection"
        - "Integration on manifolds"

    - module: 4
      title: "Motion of test particles in curved spacetime"
      lectures: 8
      tutorials: 0
      labs: 0

      topics:
        - "Action for a free particle in curved spacetime, geodesic equation, local inertial frames"
        - "Isometries: the Killing equation and conserved quantities"
        - "Geometry outside the star: Schwarzschild solution, symmetries and conserved quantities"
        - "Motion of particles in the Schwarzschild metric: gravitational redshift, precession of the perihelion, bending of light"

    - module: 5
      title: "Einstein equations"
      lectures: 10
      tutorials: 0
      labs: 0

      topics:
        - "Riemann tensor, geodesic deviation, curvature"
        - "Action for the gravitational field, Einstein equations"
        - "Stress-energy tensor: perfect fluid, scalar and electromagnetic field"

    - module: 6
      title: "Term paper presentations"
      lectures: 4
      tutorials: 0
      labs: 0

      topics:
        - "Student term paper presentations; possible topics include the Friedmann-Robertson-Walker (FRW) metric, gravitational waves, verifying the Schwarzschild solution, black holes, etc."

  # ===============
  # Study Materials
  # ===============
  study_materials:

    textbooks:

      - title: "Spacetime and Geometry"
        authors: "S. Carroll"
        publisher: "Pearson India (2016)"
        isbn: "978-9332571655"

      - title: "Gravity: An Introduction to Einstein's General Relativity"
        authors: "J. B. Hartle"
        publisher: "Pearson Education (2014)"
        isbn: "9332535086"

      - title: "General Relativity: An Introduction for Physicists"
        authors: "M. P. Hobson"
        publisher: "Cambridge University Press (2006)"
        isbn: "0521829518"

    references:

      - title: "The Classical Theory of Fields (Course of Theoretical Physics, Volume 2)"
        authors: "L. D. Landau and E. M. Lifshitz"
        publisher: "4th Edition, CBS Publishers"
        isbn: "9788181477873"

      - title: "General Relativity"
        authors: "R. M. Wald"
        publisher: "The University of Chicago Press (1984)"
        isbn: "8188689270"

      - title: "A First Course in General Relativity"
        authors: "B. F. Schutz"
        publisher: "Cambridge University Press (1990)"
        isbn: "1107696690"

      - title: "Gravitation and Cosmology: Principles and Applications of the General Theory of Relativity"
        authors: "S. Weinberg"
        publisher: "Wiley"
        isbn: "978-8126517558"

