        publisher: "9th Edition"
        isbn: "978-8126531356"

      - title: "Numerical Methods for Engineers"
        authors: "Steven Chapra, Raymond Canale"
        publisher: "6th Edition"
        isbn: "978-0-07-340106-5"

      - title: "Numerical Methods for Scientific and Engineering Computation"
        authors: "M. K. Jain, S. R. K. Iyengar, R. K. Jain"
