- code:  5624
  title: Introduction to Statistical Mechanics
  program: btech
  category: elective
  ltpc: "3-0-0-3"
  credit: 3
  type: theory
  year: "2-4"
  semester: "3-8"
  offered_by: dop
  link:
  status: approved
  course_type: SME
  prerequisites: 1030
  basket: btech_minor
  senate: 
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Review of thermodynamics"
      lectures: 10
      tutorials: 0
      labs: 0

      topics:
        - "Equilibrium and state quantities, ideal gas, kinetic theory of gases, distribution of molecular speeds"
        - "Pressure, work, chemical potential, heat, heat capacity, specific heat, entropy"
        - "Equation of state of an ideal and non-ideal gas"
        - "Laws of thermodynamics, thermodynamic potentials, free energy, phase transitions"

    - module: 2
      title: "Probability theory and the statistical foundations of mechanics"
      lectures: 9
      tutorials: 0
      labs: 0

      topics:
        - "Basics of probability theory and different probability distributions"
        - "Central limit theorem, random walk, Brownian motion"
        - "Connecting statistics with mechanics: phase space concept, evolution in phase space"
        - "Many-body interactions leading to steady state and equilibrium"

    - module: 3
      title: "Statistical Mechanics and Ensemble Theory"
      lectures: 23
      tutorials: 0
      labs: 0

      topics:
        - "Counting microstates, statistical definition of entropy, Gibbs paradox"
        - "Phase space density and ergodicity, Liouville's theorem"
        - "Microcanonical, canonical and grand canonical ensembles and partition functions"
        - "Calculations of physical properties and equivalence of ensembles"
        - "Review and derivation of thermodynamic relations from ensemble theory"
        - "Fluctuations and correlations"
        - "Examples: ideal gas, non-interacting magnetic systems"

