# Quantum Mechanics I
- code: 5007
  title: Quantum Mechanics I
  program: msc
  category: core
  ltpc: "3-1-0-4"
  credit: 4
  type: theory
  year: 1
  semester: 1
  offered_by: dop
  link:
  status: approved
  course_type: PMC
  prerequisites:
  basket:
  senate:
  # ==============
  # syllabus
  # ==============
  syllabus:

    - module: 1
      title: "Origin of quantum theory"
      lectures: 3
      tutorials: 0
      labs: 0

      topics:
        - "Basic principles of quantum mechanics"

    - module: 2
      title: "Linear Algebra"
      lectures: 7
      tutorials: 3
      labs: 0

      topics:
        - "Linear vector spaces"
        - "Bra and ket vectors"
        - "Inner products"
        - "Hilbert space"
        - "Operators"
        - "Completeness and orthonormality"
        - "Basis sets and change of basis"
        - "Eigenstates and eigenvalues"
        - "Wave-functions"
        - "Expectation values"
        - "Uncertainty relation"
        - "Position and momentum representations"

    - module: 3
      title: "Hilbert space formulation of quantum mechanics"
      lectures: 5
      tutorials: 2
      labs: 0

      topics:
        - "States, observables and measurement"
        - "Discrete and continuous spectra"
        - "Wavefunctions in position and momentum space"

    - module: 4
      title: "Dynamics"
      lectures: 5
      tutorials: 2
      labs: 0

      topics:
        - "Time evolution"
        - "Hamiltonian"
        - "Schrodinger equation"
        - "Schrodinger and Heisenberg picture"
        - "Probability current"

    - module: 5
      title: "Simple 1D Examples"
      lectures: 7
      tutorials: 2
      labs: 0

      topics:
        - "Particle in a box"
        - "Delta function"
        - "Finite well and potential barriers"
        - "Bound states and scattering"
        - "Harmonic oscillator: wavefunction and operator approach"

    - module: 6
      title: "Symmetries in Quantum Mechanics"
      lectures: 5
      tutorials: 2
      labs: 0

      topics:
        - "Discrete symmetries"
        - "Translation"
        - "Parity"
        - "Time reversal"
        - "Rotational symmetry"

    - module: 7
      title: "Hydrogen atom"
      lectures: 8
      tutorials: 2
      labs: 0

      topics:
        - "Orbital angular momentum operators"
        - "Operator and wave function approach"
        - "Spherical harmonics"
        - "Fine and hyperfine structure of H atom"

    - module: 8
      title: "Systems of identical particles"
      lectures: 2
      tutorials: 1
      labs: 0

      topics:
        - "Permutation symmetry"
        - "Symmetric and antisymmetric wavefunctions"
        - "Bosons and Fermions"
        - "Pauli's exclusion principle"

