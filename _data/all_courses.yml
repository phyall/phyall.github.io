# Electromagnetic Theory
- code: 5003
  title: Electromagnetic Theory
  program: msc
  category: core
  ltpc: "3-1-0-4"
  credit: 4
  type: theory
  year: 1
  semester: 1
  offered_by: dop
  link:
  status: approved
  course_type: PMC
  prerequisites:
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Electrostatics, boundary value problems and magnetostatics"
      lectures: 13
      tutorials: 5
      labs: 0

      topics:
        - "Maxwell's equations, review of electrostatics"
        - "Solving partial differential equations: Laplace and Poisson's equations, boundary value problems"
        - "Special functions: Hermite, Legendre, Laguerre and Bessel functions"
        - "Review of magnetostatics, Faraday's law of induction, self- and mutual inductance"

    - module: 2
      title: "Maxwell's equations in matter"
      lectures: 8
      tutorials: 2
      labs: 0

      topics:
        - "Maxwell's equations within matter"
        - "Vector and scalar potentials"
        - "Gauge transformations"
        - "Poynting's theorem"

    - module: 3
      title: "Electromagnetic waves"
      lectures: 9
      tutorials: 3
      labs: 0

      topics:
        - "Propagation of electromagnetic waves in vacuum and in a medium"
        - "Laws of reflection and refraction"
        - "Absorption and transmission"
        - "Waveguides"

    - module: 4
      title: "Relativistic electrodynamics and radiation"
      lectures: 12
      tutorials: 4
      labs: 0

      topics:
        - "Relativistic formulation of Maxwell's equations, covariant form"
        - "Transformation formulae for electric and magnetic fields, invariants of fields"
        - "Field produced by a uniformly moving charged particle"
        - "Accelerating charges and radiation: field for an accelerating charged particle"
        - "Lienard-Wiechert potentials, Larmor's formula"
        - "Radiation from a dipole"

  # ===============
  # Study Materials
  # ===============
  study_materials:

    textbooks:

      - title: "Classical Electrodynamics"
        authors: "J. D. Jackson"
        publisher: "Wiley, 3rd Edition"
        isbn: "978-8126510948"

      - title: "Introduction to Electrodynamics"
        authors: "D. J. Griffiths"
        publisher: "Prentice Hall India Pvt Ltd, 3rd Edition"
        isbn: "81-203-1601-0"

      - title: "Electricity and Magnetism"
        authors: "E. M. Purcell"
        publisher: "Berkeley Physics Course (Volume 2), McGraw Hill Education (India) Pvt Ltd"
        isbn: "978-0-07-070214-1"

    references:

      - title: "Classical Electrodynamics"
        authors: "J. Schwinger, L. L. Deraad Jr., K. A. Milton, W.-Y. Tsai, J. Norton"
        publisher: "Westview Press"
        isbn: "978-0738200569"

