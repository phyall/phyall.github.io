  #=============
  syllabus:

    - module: 1
      title: "Revisiting quantum mechanics"
      lectures: 12
      tutorials: 0
      labs: 0

      topics:
        - "Linear algebra: linear independence and bases, Hilbert space, tensor product"
        - "Postulates of quantum mechanics: state space, Hamiltonian, evolution, quantum measurement (projection measurement, POVM, generalized measurement)"
        - "Density matrices for quantum states: pure and mixed states"
        - "Introducing qubits: two-level systems, Bloch sphere"
        - "Composite systems: partial trace and reduced states, Schmidt decomposition"
        - "EPR paradox and Bell inequality, entanglement"

    - module: 2
      title: "Quantum communication and cryptography"
      lectures: 12
      tutorials: 0
      labs: 0

      topics:
        - "No-cloning theorem, quantum teleportation, quantum dense coding"
        - "Quantum cryptography: BB84 and Ekert protocols"
        - "Multiparty scenario of quantum communication"
        - "Quantum state discrimination"

    - module: 3
      title: "Entropy and entanglement"
      lectures: 10
      tutorials: 0
      labs: 0

      topics:
        - "Basics of probability theory"
        - "Shannon entropy, von Neumann entropy"
        - "Conditional entropy and mutual information"
        - "Entanglement for pure and mixed states"
        - "Entanglement measures, entanglement witness, entanglement in multipartite systems"

    - module: 4
      title: "Quantum computation"
      lectures: 8
      tutorials: 0
      labs: 0

      topics:
        - "Introducing quantum algorithms (at least two examples)"
        - "Quantum gates and quantum circuit elements"
        - "Introduction to quantum error correction (example of three-qubit bit-flip code)"

