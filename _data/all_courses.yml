  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Physics and measurement"
      lectures: 1
      tutorials: 0
      labs: 0

      topics:
        - "Units and dimensions, dimensional analysis"
        - "Least count, significant figures"
        - "Methods of measurement and error analysis for physical quantities"

    - module: 2
      title: "Mechanics"
      lectures: 5
      tutorials: 3
      labs: 0

      topics:
        - "Kinematics in one and two dimensions (Cartesian coordinates only), projectiles"
        - "Uniform circular motion, relative velocity"
        - "Newton's laws of motion; inertial and uniformly accelerated frames of reference"
        - "Static and dynamic friction"
        - "Conservation of momentum, centre of mass and its motion, impulse"
        - "Elastic and inelastic collisions"
        - "Mechanical equilibrium of a particle, common forces in mechanics"

    - module: 3
      title: "Work, Energy and Power"
      lectures: 3
      tutorials: 2
      labs: 0

      topics:
        - "Kinetic and potential energy, work and power"
        - "Conservation of mechanical energy"
        - "Work-energy theorem (including variable force)"
        - "Elastic and inelastic collisions in one and two dimensions"

    - module: 4
      title: "Systems of particles"
      lectures: 2
      tutorials: 1
      labs: 0

      topics:
        - "Rigid body, moment of inertia"
        - "Parallel and perpendicular axes theorems"
        - "Moment of inertia of uniform bodies with simple geometrical shapes"

    - module: 5
      title: "Angular momentum and rotational dynamics"
      lectures: 3
      tutorials: 2
      labs: 0

      topics:
        - "Angular momentum, torque, conservation of angular momentum"
        - "Dynamics of rigid bodies with fixed axis of rotation"
        - "Rolling without slipping (example rings, cylinders and spheres)"
        - "Equilibrium of rigid bodies"

    - module: 6
      title: "Properties of Bulk Matter"
      lectures: 3
      tutorials: 2
      labs: 0

      topics:
        - "Simple harmonic motion, Hooke's law, Young's modulus"
        - "Pressure in a fluid, Pascal's law, buoyancy"
        - "Surface energy and surface tension, viscosity, Stoke's law"
        - "Terminal velocity, streamline flow, equation of continuity, Bernoulli's theorem and its applications"

    - module: 7
      title: "Gravitation"
      lectures: 2
      tutorials: 1
      labs: 0

      topics:
        - "Gravitational potential and field, acceleration due to gravity"
        - "Motion of planets and satellites in circular orbits"
        - "Escape velocity"

    - module: 8
      title: "Waves"
      lectures: 4
      tutorials: 1
      labs: 0

      topics:
        - "Wave motion (plane waves only), longitudinal and transverse waves, superposition of waves"
        - "Progressive and stationary waves, vibration of strings and air columns"
        - "Resonance, beats"
        - "Speed of sound in gases, Doppler effect (in sound)"

    - module: 9
      title: "Thermodynamics"
      lectures: 4
      tutorials: 2
      labs: 0

      topics:
        - "Thermal equilibrium, zeroth law of thermodynamics, ideal gas laws"
        - "Specific heats (Cv and Cp for monoatomic and diatomic gases)"
        - "Isothermal and adiabatic processes, equivalence of heat and work"
        - "First law of thermodynamics and its applications (only for ideal gases)"
        - "Entropy and second law of thermodynamics, latent heat"
        - "Blackbody radiation: Kirchhoff's law, Wien's displacement law, Stefan's law"

    - module: 10
      title: "Kinetic Theory"
      lectures: 1
      tutorials: 0
      labs: 0

      topics:
        - "Equipartition theorem for ideal gas, mean free path"

