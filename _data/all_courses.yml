# Nonequilibrium Statistical Physics
- code: 6607
  title: Nonequilibrium Statistical Physics
  program: msc
  category: elective
  ltpc: "3-0-0-3"
  credit: 3
  type: theory
  year: 2
  semester:
  offered_by: dop
  link:
  status: approved
  course_type: PME
  prerequisites:
  basket:
  senate:
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Introduction"
      lectures: 5
      tutorials: 0
      labs: 0

      topics:
        - "Recap of equilibrium statistical mechanics needed for non-equilibrium statistical mechanics"
        - "Fluctuations and irreversibility in macroscopic systems, approach to the equilibrium state"
        - "Boltzmann transport equation, linear irreversible thermodynamics"
        - "Review of critical phenomena and scaling, dynamic scaling (Edwards-Wilkinson and KPZ models, time-dependent Ginzburg-Landau models)"

    - module: 2
      title: "Microscopic Approach - Langevin Equation and Fluctuation-Dissipation Relation"
      lectures: 6
      tutorials: 0
      labs: 0

      topics:
        - "The Langevin equation, the Maxwellian distribution of velocities, equation of motion of the Brownian particle"
        - "The fluctuation-dissipation relation, conditional and complete ensemble averages"
        - "Conditional mean squared velocity, velocity correlation time, stationarity of a random process"
        - "Velocity autocorrelation in three dimensions, time reversal property of the correlation matrix"

    - module: 3
      title: "Dynamics of a Brownian Particle"
      lectures: 6
      tutorials: 0
      labs: 0

      topics:
        - "Free particle, mean squared displacement in equilibrium, time scales in the Langevin model"
        - "Equilibrium autocorrelation function, conditional autocorrelation function, fluctuations in the displacement"
        - "Velocity-position cross-correlation"
        - "Particles in an external potential, Langevin equation in an external potential, the Brownian oscillator"

    - module: 4
      title: "Fokker-Planck Equation"
      lectures: 8
      tutorials: 0
      labs: 0

      topics:
        - "Diffusion process and diffusion equation, the fundamental Gaussian solution, diffusion in three dimensions"
        - "Smoluchowski equation for the oscillator"
        - "Fokker-Planck equation and its relation with the stochastic differential equation"
        - "Kramers' escape rate formula, the Ornstein-Uhlenbeck distribution"

    - module: 5
      title: "Green-Kubo Formulas"
      lectures: 8
      tutorials: 0
      labs: 0

      topics:
        - "Diffusion constant in terms of the velocity autocorrelation, generalization to three dimensions"
        - "The mobility, relation between diffusivity and the static mobility, the dynamic mobility"
        - "Kubo-Green formula for the dynamic mobility, application to the Brownian oscillator"

    - module: 6
      title: "Generalised Langevin Equation"
      lectures: 3
      tutorials: 0
      labs: 0

      topics:
        - "Memory kernel, frequency dependent friction"
        - "Maxwell model for visco-elastic fluids"
        - "Generalized fluctuation-dissipation theorem"

    - module: 7
      title: "Nonequilibrium Fluctuations"
      lectures: 6
      tutorials: 0
      labs: 0

      topics:
        - "Brownian ratchets, Brownian motors"
        - "Thermodynamics at the molecular level"
        - "Fluctuation theorems, Crooks' theorem, Jarzynski equality"

