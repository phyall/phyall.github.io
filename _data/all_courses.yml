      - title: "Mathematical Physics, Vol I"
        authors: "S. D. Joglekar"
        publisher: "University Press (2005)"
        isbn: "978-8173714221"

      - title: "Mathematical Physics, Vol II"
        authors: "S. D. Joglekar"
        publisher: "University Press"
        isbn: "978-8173715600"

      - title: "Advanced Engineering Mathematics"
