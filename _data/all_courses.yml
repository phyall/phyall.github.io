- code: 5009
  title: Condensed Matter Physics
  program: msc
  category: core
  ltpc: "3-1-0-4"
  credit: 4
  type: theory
  year: 2
  semester: 3
  offered_by: dop
  link:
  status: approved
  course_type: PMC
  prerequisites:
  #=============
  # Syllabus
  #=============
  syllabus:

    - module: 1
      title: "Introduction to condensed matter and crystal structure"
      lectures: 6
      tutorials: 2
      labs: 0

      topics:
        - "Length, time and energy scales in condensed matter"
        - "Order-disorder transition, long-range and short-range order, correlation functions"
        - "Soft and hard condensed matter, examples of material properties"
        - "Bonding and interactions, van der Waals interaction, hydrogen bonding"
        - "Review of crystals: lattice, basis, 2-d and 3-d crystals, point and space groups, symmetries"
        - "Experimental determination of structure, scattering, lattice with basis, Miller indices, structure factor, form factors"
        - "Defects in crystals"

    - module: 2
      title: "Lattice vibrations"
      lectures: 9
      tutorials: 3
      labs: 0

      topics:
        - "Cohesion of solids, mechanical properties, elasticity, constitutive relations"
        - "Modes of lattice vibrations, quantization and phonons"
        - "Statistical mechanics of phonon gas, Einstein and Debye models"
        - "Umklapp processes, thermal expansion, Kohn anomalies, charge density waves"
        - "Electron-phonon interactions"

    - module: 3
      title: "Electronic structure and band theory"
      lectures: 12
      tutorials: 4
      labs: 0

      topics:
        - "Single electron model, density of states, Fermi surface and quasiparticles"
        - "Specific heat, magnetic susceptibility"
        - "Electrons in periodic potentials, Bloch's theorem, Kronig-Penney model"
        - "Nearly free and tightly bound electrons, Fermi surfaces, band theory, effective mass"
        - "Wannier functions and tight binding, electronic states at surfaces"
        - "Dynamics of Bloch electrons: transport properties, Drude model, electrical conductivity, Boltzmann equation"
        - "Thermal conductivity and thermoelectric phenomena"

    - module: 4
      title: "Magnetism and superconductivity"
      lectures: 6
      tutorials: 2
      labs: 0

      topics:
        - "Atomic magnetism, Hund's rules, Curie's law"
        - "Pauli paramagnetism, Landau diamagnetism, quantum mechanics of interacting moments"
        - "Superconductivity: phenomenology including Meissner effect, type-I and type-II superconductors"
        - "BCS theory"

    - module: 5
      title: "Introduction to soft matter physics"
      lectures: 9
      tutorials: 3
      labs: 0

      topics:
        - "Introduction to soft matter physics: polymers, colloids, surfactants, liquid crystals"
        - "Brownian motion and thermal fluctuations: Brownian motion of a free particle, Brownian motion in a potential field"
        - "Fluctuation-dissipation theorem"
        - "Polymers: freely jointed model, worm-like chain (WLC) model, Flory theory"
        - "Surfaces and surfactants: surface tension, wetting, surfactants"

